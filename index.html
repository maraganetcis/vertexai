<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="author" content="Synox Studios" />
  <meta name="theme-color" content="#f7fbff" />
  <meta name="description" content="Vertex — Synox Studios의 개인용 학습·일정·음성 비서 플랫폼" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./style.css" />
  <title>Vertex — Your daily command center | Synox Studios</title>
</head>
<body>
  <div class="app-shell" id="app">
    <header class="header">
      <button class="logo-button" id="homeLogo" aria-label="홈으로 이동"><span class="logo-symbol">✦</span><span>Vertex <em>AI</em></span></button>
      <div class="header-tools">
        <span class="sync-pill" id="syncStatus">● 로컬 저장 · 동기화 준비 중</span>
        <button class="icon-btn" id="notificationButton" aria-label="오늘 알림 보기" title="오늘 알림 보기">♧<span class="notification-dot"></span></button>
        <button class="icon-btn" id="profileButton" aria-label="설정 열기" title="설정 열기">☰</button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="bottom-nav" id="bottomNav" aria-label="주 메뉴">
      <button data-page="home" class="nav-item active"><span>⌂</span><small>홈</small></button>
      <button data-page="school" class="nav-item"><span>▤</span><small>학교</small></button>
      <button data-page="transport" class="nav-item"><span>▣</span><small>교통</small></button>
      <button data-page="planner" class="nav-item"><span>▦</span><small>플래너</small></button>
      <button data-page="assistant" class="nav-item"><span>✧</span><small>비서</small></button>
    </nav>
  </div>
  <dialog id="editorDialog" class="editor-dialog"><form id="editorForm" method="dialog"><h2 id="dialogTitle">항목 편집</h2><div id="formFields"></div><div class="dialog-actions"><button value="cancel" class="btn ghost" type="button" id="cancelDialog">취소</button><button class="btn primary" type="submit">저장</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
