<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="author" content="Synox Studios" />
  <meta name="theme-color" content="#eef6ff" />
  <meta name="description" content="Vertex — Synox Studios의 개인용 학습·일정·날씨·교통 비서 플랫폼" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <title>Vertex — Your daily command center | Synox Studios</title>
</head>
<body>
  <div class="app-shell" id="app">
    <header class="header">
      <button class="logo-button" id="homeLogo" aria-label="홈으로 이동">
        <span class="logo-symbol" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5"/><path d="M12 12v9"/><path d="M12 12L4 7.5"/></svg>
        </span>
        <span class="logo-wordmark">Vertex</span>
      </button>

      <nav class="desktop-nav" aria-label="데스크톱 주 메뉴">
        <button data-page="home" class="top-nav-link active">홈</button>
        <button data-page="school" class="top-nav-link">학교</button>
        <button data-page="planner" class="top-nav-link">플래너</button>
        <button data-page="study" class="top-nav-link">학습</button>
        <button data-page="transport" class="top-nav-link">교통</button>
        <button data-page="assistant" class="top-nav-link">비서</button>
      </nav>

      <div class="header-tools">
        <span class="sr-only" id="syncStatus">로컬 저장 · 동기화 준비 중</span>
        <button class="icon-btn icon-sky" id="searchButton" aria-label="통합 검색" title="통합 검색">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="icon-btn icon-amber" id="themeToggle" aria-label="테마 전환" title="다크/라이트 모드 전환">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn icon-rose" id="notificationButton" aria-label="오늘 알림 보기" title="오늘 알림 보기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notification-dot" id="notificationDot"></span>
        </button>
        <button class="icon-btn icon-indigo" id="profileButton" aria-label="설정 열기" title="설정 열기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="주 메뉴">
      <button data-page="home" class="nav-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <small>홈</small>
      </button>
      <button data-page="school" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <small>학교</small>
      </button>
      <button data-page="planner" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <small>플래너</small>
      </button>
      <button data-page="study" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <small>학습</small>
      </button>
      <button data-page="transport" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M3 10h18"/><path d="M7 16v3"/><path d="M17 16v3"/><circle cx="7.5" cy="13.5" r="1"/><circle cx="16.5" cy="13.5" r="1"/></svg>
        <small>교통</small>
      </button>
      <button data-page="assistant" class="nav-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <small>비서</small>
      </button>
    </nav>
  </div>

  <dialog id="editorDialog" class="editor-dialog">
    <form id="editorForm" method="dialog">
      <h2 id="dialogTitle">항목 편집</h2>
      <div id="formFields"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" type="button" id="cancelDialog">취소</button>
        <button class="btn primary" type="submit">저장</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="editor-dialog confirm-dialog">
    <div class="confirm-box">
      <h2 id="confirmTitle">확인</h2>
      <p id="confirmMessage" class="confirm-message"></p>
      <div id="confirmInputWrap" hidden>
        <input id="confirmInput" class="field" type="text" autocomplete="off" />
      </div>
      <div class="dialog-actions">
        <button class="btn ghost" type="button" id="confirmCancelBtn">취소</button>
        <button class="btn primary" type="button" id="confirmOkBtn">확인</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./firebase-config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
