[build]
  command = "node prepare-public.mjs"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/vertex-public-api?service=ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/neis"
  to = "/.netlify/functions/vertex-public-api?service=neis"
  status = 200
  force = true

[[redirects]]
  from = "/api/weather"
  to = "/.netlify/functions/vertex-public-api?service=weather"
  status = 200
  force = true

[[redirects]]
  from = "/api/transit"
  to = "/.netlify/functions/vertex-public-api?service=transit"
  status = 200
  force = true

[[redirects]]
  from = "/api/sheet-sync"
  to = "/.netlify/functions/vertex-sheet-sync"
  status = 200
  force = true

[[redirects]]
  from = "/api/voice"
  to = "/.netlify/functions/vertex-voice"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
